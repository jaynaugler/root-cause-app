[project]
name = "root-cause-api"
version = "0.1.0"
description = "FastAPI + MongoDB service for root-cause"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"motor>=3.6",
	"dnspython>=2.6",
	"pydantic-settings>=2.6",
	"pypdf>=7.0.0",
	"httpx>=0.28.1",
	"pillow>=13.0.0",
	"pytesseract>=0.3.13",
	"pypdfium2>=5.15.0",
	"youtube-transcript-api>=1.2.5",
	"feedparser>=6.0.14",
	"psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

